{% extends "layout/base.html" %} {% block title %}Settings - CVPilot AI{%
endblock %} {% block content %} {% include "layout/navbar.html" %}

<div class="dashboard-container">
  <div class="dashboard-welcome">
    <h1>Settings ⚙️</h1>
    <p>Manage your profile and account security.</p>
  </div>

  <!-- Profile Section -->
  <div class="analysis-section" style="max-width: 600px">
    <h3>Edit Profile</h3>
    <form method="POST" action="{{ url_for('settings.update_profile') }}">
      <div class="form-group">
        <label>Full Name</label>
        <input
          type="text"
          name="full_name"
          value="{{ current_user.full_name }}"
          required
        />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input
          type="email"
          value="{{ current_user.email }}"
          disabled
          style="background: #f3f4f6; cursor: not-allowed"
        />
      </div>
      <button
        type="submit"
        class="btn-primary"
        style="width: auto; padding: 10px 24px"
      >
        Save Changes
      </button>
    </form>
  </div>

  <!-- Change Password Section -->
  <div class="analysis-section" style="max-width: 600px">
    <h3>Change Password</h3>
    <form method="POST" action="{{ url_for('settings.change_password') }}">
      <div class="form-group">
        <label>Current Password</label>
        <input
          type="password"
          name="current_password"
          placeholder="••••••••"
          required
        />
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input
          type="password"
          name="new_password"
          placeholder="••••••••"
          required
          minlength="6"
        />
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input
          type="password"
          name="confirm_password"
          placeholder="••••••••"
          required
          minlength="6"
        />
      </div>
      <button
        type="submit"
        class="btn-primary"
        style="width: auto; padding: 10px 24px"
      >
        Update Password
      </button>
    </form>
  </div>
</div>
{% endblock %}
